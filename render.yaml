# Render 무료 인스턴스(512MB)용 Blueprint: 백엔드 + AI 분석 서버. 사용법은 docs/deployment.md 참고.
# Kafka·Redis 없이 단독 실행한다(탐지는 sync 모드, 알림 중복 방지는 메모리).
# 배포는 CD 워크플로가 Deploy Hook으로 요청하므로 autoDeploy는 끈다.
services:
  - type: web
    name: chainwatch-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      - key: PORT
        value: "8080"
      # 512MB 한도에 맞춘 JVM 설정. 로컬에서 RSS 약 400MB로 확인.
      - key: JAVA_TOOL_OPTIONS
        value: >-
          -XX:+UseSerialGC -Xmx192m -Xss512k -XX:MaxMetaspaceSize=140m
          -XX:ReservedCodeCacheSize=40m -XX:TieredStopAtLevel=1
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Kafka·Redis가 없는 환경: 토픽 자동 생성 대기와 Redis 헬스 체크를 끈다.
      - key: SPRING_KAFKA_ADMIN_AUTO_CREATE
        value: "false"
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"
      - key: CHAINWATCH_KAFKA_ENABLED
        value: "false"
      - key: CHAINWATCH_REDIS_ENABLED
        value: "false"
      - key: CHAINWATCH_DETECTION_MODE
        value: sync
      - key: CHAINWATCH_NOTIFICATION_DEDUP_STORE
        value: memory
      # 외부 PostgreSQL(예: Neon 무료 플랜). 무료 인스턴스는 유휴 시 재시작되므로 영속 DB가 필요하다.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: CHAINWATCH_JWT_ENABLED
        value: "true"
      - key: CHAINWATCH_JWT_SECRET
        generateValue: true
      - key: CHAINWATCH_PASSWORD_PEPPER
        generateValue: true
      - key: CHAINWATCH_ADMIN_USERNAME
        value: admin
      # 최초 계정 생성용. `{noop}비밀번호` 형식으로 입력하면 저장 시 BCrypt로 인코딩된다.
      - key: CHAINWATCH_ADMIN_PASSWORD
        sync: false
      # 분석가 계정도 같은 형식으로 입력한다. 개발 기본값이면 계정이 만들어지지 않는다.
      - key: CHAINWATCH_ANALYST_PASSWORD
        sync: false
      # OFAC 제재 주소 목록을 기동 1분 뒤와 이후 24시간마다 공개 목록에서 동기화한다(제재 주소 탐지 룰의 기준).
      - key: CHAINWATCH_SANCTIONS_SYNC_ENABLED
        value: "true"
      # 메인넷 수집은 무료 DB 용량을 빠르게 채우므로 기본은 꺼 둔다.
      - key: CHAINWATCH_COLLECTOR_ENABLED
        value: "false"
      # AI 분석: AI 서버를 먼저 띄우고 Gemini 키를 넣은 뒤, 대시보드에서 아래 두 값을 입력해 켠다.
      # true로 바꾸면 이벤트 상세의 AI 분석 버튼과 관리자 재분석 메뉴가 나타난다.
      - key: CHAINWATCH_AI_ENABLED
        sync: false
      # AI 서버 공개 주소 (예: https://chainwatch-ai-analysis.onrender.com)
      - key: CHAINWATCH_AI_BASE_URL
        sync: false
      # AI 서버가 생성한 공유 토큰을 그대로 받아 요청 헤더에 싣는다.
      - key: CHAINWATCH_AI_API_TOKEN
        fromService:
          type: web
          name: chainwatch-ai-analysis
          envVarKey: CHAINWATCH_AI_API_TOKEN
      # 자동 분석 워커: 아직 분석되지 않은 미종결 고위험 이벤트를 3분에 1건씩 분석한다.
      # 24시간 깨어 있어도 하루 최대 480건이다. Gemini 무료 한도는 자주 바뀌는데, 2026-10 기준으로
      # Flash 약 20건·Flash-Lite 약 500건/일로 알려져 그 안에 들어오게 잡았다. 기본 모델의 한도를 넘으면
      # AI 서버가 예비 모델로 넘어가고, 그래도 실패하면 그 건만 분석 실패로 남는다.
      # 백엔드가 잠들면 워커도 멈추고 AI 서버도 15분 뒤 잠들어, Render 무료 인스턴스 시간은 방문이 있을 때만 쓴다.
      - key: CHAINWATCH_AI_WORKER_ENABLED
        value: "true"
      - key: CHAINWATCH_AI_WORKER_POLL_INTERVAL_MS
        value: "180000"
      - key: CHAINWATCH_AI_WORKER_BATCH_SIZE
        value: "1"

  # AI 분석 서버(FastAPI). 백엔드가 공유 토큰을 실어 보낸 요청만 처리한다.
  - type: web
    name: chainwatch-ai-analysis
    runtime: docker
    plan: free
    rootDir: ai/analysis-server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # CD의 Deploy Hook 대상이 아니므로 AI 서버 코드가 바뀐 커밋에서만 자동 배포한다.
    autoDeploy: true
    buildFilter:
      paths:
        - ai/analysis-server/**
    envVars:
      - key: PORT
        value: "8000"
      - key: CHAINWATCH_AI_DEFAULT_PROVIDER
        value: gemini
      - key: CHAINWATCH_AI_FALLBACK_CHAIN
        value: gemini
      # 재시도는 Gemini 예비 모델 전환이 대신한다. 체인 전체를 두 번 돌면 백엔드 제한(120초)을 넘을 수 있다.
      - key: CHAINWATCH_AI_RETRY_MAX_ATTEMPTS
        value: "1"
      # Google AI Studio에서 발급. 결제를 연결하지 않은 프로젝트의 키를 쓰면 무료 한도 안에서만 동작한다.
      - key: CHAINWATCH_AI_GEMINI_API_KEY
        sync: false
      - key: CHAINWATCH_AI_API_TOKEN
        generateValue: true
