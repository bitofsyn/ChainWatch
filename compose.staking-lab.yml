# Isolated local observation database. No existing ChainWatch volumes are reused.
name: chainwatch-staking-lab
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: staking_lab
      POSTGRES_USER: staking_lab
      POSTGRES_PASSWORD: staking_local_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - staking_lab_pg:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/staking:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staking_lab -d staking_lab"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  staking_lab_pg:
